<!DOCTYPE html>
<html>
<head>
  <title>Sign Up - Champions Sport House</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0a192f; color: white; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background-color: #112240; border: 1px solid #233554; border-radius: 10px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); width: 100%; max-width: 450px; animation: cardEntry 0.8s ease-out forwards; }
    @keyframes cardEntry { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    h3 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: 1px; }
    .form-group { opacity: 0; animation: slideUp 0.6s ease-out forwards; }
    .form-group:nth-child(1) { animation-delay: 0.2s; }
    .form-group:nth-child(2) { animation-delay: 0.4s; }
    .form-group:nth-child(3) { animation-delay: 0.6s; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .form-control { background-color: #0a192f; color: white; border: 1px solid #233554; border-radius: 5px; padding: 12px; transition: all 0.3s ease; }
    label { color: #a8b2d1; font-weight: 600; }
    .form-control::placeholder { color: #8892b0; opacity: 1; }
    .form-control:focus { background-color: #0a192f; color: white; border-color: #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); transform: scale(1.02); }
    .btn-brand { background-color: #00d2ff; color: black; font-weight: 900; text-transform: uppercase; border-radius: 5px; padding: 12px; letter-spacing: 1px; transition: all 0.3s ease; }
    .btn-brand:hover { background-color: #ffcc00; color: black; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 204, 0, 0.3); }
    a { color: #00d2ff; transition: 0.3s; text-decoration: none; }
    a:hover { color: #ffcc00; }
  </style>
</head>
<body>
  <div class="card p-5">
    <h3 class="text-center mb-4">Create Account</h3>
    <form id="signupForm">
      <div class="form-group mb-4">
        <label class="mb-2">Full Name</label>
        <input type="text" id="name" class="form-control" required placeholder="Enter your name">
      </div>
      <div class="form-group mb-4">
        <label class="mb-2">Email Address</label>
        <input type="email" id="email" class="form-control" required placeholder="Enter your email">
      </div>
      <div class="form-group mb-4">
        <label class="mb-2">Password</label>
        <input type="password" id="password" class="form-control" required placeholder="Create a password">
      </div>
      <button type="submit" class="btn btn-brand w-100 mt-2 mb-3" style="opacity: 0; animation: slideUp 0.6s ease-out 0.8s forwards;">Sign Up</button>
    </form>
    <div id="message" class="mt-2 text-center" style="opacity: 0; animation: slideUp 0.6s ease-out 1s forwards;"></div>
    <div class="text-center mt-3" style="opacity: 0; animation: slideUp 0.6s ease-out 1s forwards;">
      <a href="/login.html">Already have an account? Login</a>
    </div>
  </div>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('message');
      msg.innerHTML = "<span class='text-warning'>Creating account...</span>";
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          msg.innerHTML = `<span class="text-success">Account created! Redirecting...</span>`;
          setTimeout(() => window.location.href = '/login.html', 1500);
        } else {
          msg.innerHTML = `<span class="text-danger">${data.error}</span>`;
        }
      } catch (err) {
        msg.innerHTML = `<span class="text-danger">Network error. Please try again.</span>`;
      }
    });
  </script>
</body>
</html>
