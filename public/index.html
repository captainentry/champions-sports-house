<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champions Sport House | All Sports. One Place.</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-black: #000000;
      --brand-navy: #0a192f;
      --brand-cyan: #00d2ff;
      --brand-yellow: #ffcc00;
    }
    body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; overflow-x: hidden; }
    h1, h2, h3, .brand-font { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; }
    
    /* Right-to-Left Sliding Adverts */
    .promo-bar { background-color: var(--brand-black); border-bottom: 2px solid var(--brand-cyan); height: 45px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; width: 100%; }
    .promo-text { color: var(--brand-yellow); font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; margin: 0; text-transform: uppercase; position: absolute; white-space: nowrap; transform: translateX(100%); opacity: 0; }
    .promo-text.active { transform: translateX(0); opacity: 1; transition: transform 0.8s ease-out, opacity 0.8s ease-out; }
    .promo-text.exit { transform: translateX(-100%); opacity: 0; transition: transform 0.8s ease-in, opacity 0.8s ease-in; }

    /* Navbar */
    .navbar { background-color: rgba(0, 0, 0, 0.95); padding: 10px 0; border-bottom: 3px solid var(--brand-cyan); backdrop-filter: blur(10px); }
    .navbar-brand { color: white !important; display: flex; align-items: center; }
    .nav-link { color: white !important; font-weight: 600; text-transform: uppercase; font-size: 14px; margin: 0 5px; transition: 0.3s; }
    .nav-link:hover { color: var(--brand-cyan) !important; transform: translateY(-2px); }
    
    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-black) 100%);
      color: white;
      padding: 80px 0 120px 0;
      text-align: center;
      position: relative;
      overflow: hidden; 
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,210,255,0.15) 0%, transparent 70%);
      z-index: 0;
      animation: pulseGlow 4s infinite alternate;
    }
    @keyframes pulseGlow { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
    
    .hero-logo {
      width: 100%; max-width: 400px; height: auto; margin-bottom: 20px;
      filter: drop-shadow(0px 10px 30px rgba(0, 210, 255, 0.4)); 
      position: relative; z-index: 10; mix-blend-mode: screen; 
      animation: floatLogo 5s ease-in-out infinite;
    }
    @keyframes floatLogo { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
