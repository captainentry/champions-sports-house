<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Champions Sport House</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; }
    h1, h2, h3, .brand-font { font-family: 'Montserrat', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; }
    .navbar { background-color: #000; padding: 10px 0; border-bottom: 3px solid #00d2ff; }
    .navbar-brand { color: white !important; }
    .nav-link { color: white !important; font-weight: 600; text-transform: uppercase; font-size: 14px; margin: 0 10px; }
    .nav-link:hover { color: #00d2ff !important; }
    .hero-contact { background: linear-gradient(135deg, #0a192f 0%, #000 100%); color: white; padding: 60px 0; text-align: center; }
    .hero-contact h1 { color: #00d2ff; }
    .contact-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .btn-brand { background-color: #00d2ff; color: black; font-weight: bold; border-radius: 5px; }
    .btn-brand:hover { background-color: #ffcc00; color: black; }
    footer { background-color: #000; color: white; padding: 40px 0; margin-top: 50px; border-top: 5px solid #00d2ff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/"><img src="/images/logo.png" alt="Logo" style="max-height: 60px;"></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/#shop">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="/about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero-contact">
    <div class="container"><h1>Contact Us</h1></div>
  </header>

  <div class="container py-5">
    <div class="row">
      <div class="col-md-5 mb-4">
        <div class="contact-card h-100">
          <h3 class="mb-4">Get In Touch</h3>
          <p><strong>📍 Location:</strong><br>Nchiru Market, Kaleo Street, 1st Floor</p>
          <p><strong>📞 Call / WhatsApp:</strong><br>
            <a href="https://wa.me/254796608974" target="_blank">0796608974</a><br>
            <a href="https://wa.me/254768274483" target="_blank">0768274483</a>
          </p>
        </div>
      </div>
      <div class="col-md-7 mb-4">
        <div class="contact-card">
          <h3 class="mb-4">Send Us a Message</h3>
          <form id="contactForm">
            <div class="mb-3"><label>Your Name</label><input type="text" id="name" class="form-control" required></div>
            <div class="mb-3"><label>Phone Number or Email</label><input type="text" id="contact" class="form-control" required></div>
            <div class="mb-3"><label>Message</label><textarea id="message" class="form-control" rows="4" required></textarea></div>
            <button type="submit" class="btn btn-brand w-100" id="submitBtn">Submit Inquiry</button>
          </form>
          <div id="contactMsg" class="mt-3 text-center"></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <h3 class="brand-font mb-3">CHAMPIONS <span style="color:#00d2ff">SPORT HOUSE</span></h3>
      <p class="mb-3">Call / WhatsApp: <strong>0796608974</strong> / <strong>0768274483</strong></p>
      <p class="text-muted small">&copy; 2024 Champions Sport House. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msgDiv = document.getElementById('contactMsg');
      btn.innerText = "Sending..."; btn.disabled = true; msgDiv.innerHTML = "";

      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            name: document.getElementById('name').value, 
            contact: document.getElementById('contact').value, 
            message: document.getElementById('message').value 
          })
        });
        const data = await res.json();
        if (res.ok) {
          msgDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
          document.getElementById('contactForm').reset();
        } else {
          msgDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
        }
      } catch (err) { msgDiv.innerHTML = `<div class="alert alert-danger">Server error.</div>`; }
      finally { btn.innerText = "Submit Inquiry"; btn.disabled = false; }
    });
  </script>
</body>
</html>
